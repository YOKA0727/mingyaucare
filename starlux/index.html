<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JX 班表通知</title>
<meta name="description" content="星宇航空台北出發與回程班機的每日通知中心（資料來源：AirLabs API）">
<meta name="theme-color" content="#0e1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JX 班表">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1b2236; --muted:#6b7183; --line:#e4dfd3;
  --gold:#a8843f; --gold-soft:#f3ead7; --accent:#1b2a4a;
  --ok:#2f7d4f; --ok-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fdf0d9; --bad:#b23a3a; --bad-bg:#fbe4e4; --info:#2c5aa0; --info-bg:#e3ecfa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --card:#161e33; --ink:#eef0f6; --muted:#9aa2b8; --line:#26304a;
    --gold:#d8b46a; --gold-soft:#2a2a2a; --accent:#d8b46a;
    --ok:#7fd3a0; --ok-bg:#16301f; --warn:#f2c06b; --warn-bg:#33270f; --bad:#f19a9a; --bad-bg:#3a1a1a; --info:#9cbcf2; --info-bg:#182a48;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --card:#161e33; --ink:#eef0f6; --muted:#9aa2b8; --line:#26304a;
  --gold:#d8b46a; --gold-soft:#2a2a2a; --accent:#d8b46a;
  --ok:#7fd3a0; --ok-bg:#16301f; --warn:#f2c06b; --warn-bg:#33270f; --bad:#f19a9a; --bad-bg:#3a1a1a; --info:#9cbcf2; --info-bg:#182a48;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:40px;height:40px;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.status-line{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.notice{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.notice h2{font-size:13px;margin:0 0 10px;color:var(--gold);letter-spacing:1px}
.nrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--line);gap:10px}
.nrow:first-of-type{border-top:0}
.nrow .lbl{font-size:12px;color:var(--muted)}
.nrow .big{font-size:17px;font-weight:700}
.nrow .cd{font-size:13px;color:var(--gold);white-space:nowrap}
.search{width:100%;margin-top:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.group-title{font-size:13px;color:var(--muted);margin:18px 2px 8px;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card.pinned{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dest{font-size:17px;font-weight:700}
.dest .code{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.pin{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);padding:0 2px}
.pin.on{color:var(--gold)}
.leg{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:10px 0 2px}
.leg+.leg{border-top:1px dashed var(--line);margin-top:8px}
.dir{font-size:11px;color:var(--muted)}
.fno{font-weight:700;font-size:15px;color:var(--accent)}
.times{font-size:15px;font-variant-numeric:tabular-nums}
.times .arrow{color:var(--muted);margin:0 4px}
.times .d{font-size:11px;color:var(--gold);margin-left:2px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap;text-align:center}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.b-none{color:var(--muted);border:1px solid var(--line)}
.term{font-size:12px;margin-top:4px;color:var(--ink);display:flex;flex-wrap:wrap;column-gap:12px}
.term .ti{white-space:nowrap}
.term b{color:var(--gold)}
.term .tsrc{font-size:10px;color:var(--muted);margin-left:3px}
.term .tna{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;line-height:1.7}
.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px;line-height:1.7;font-size:14px}
.setup h2{margin:0 0 6px;font-size:17px}
.setup ol{padding-left:20px;margin:6px 0}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.btn{display:inline-block;border:0;background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:4px}
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;overflow:auto;max-height:88vh}
.dlg h2{margin:0 0 4px;font-size:18px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.6;word-break:break-word}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>JX 班表通知中心<small id="dateLabel">—</small></h1>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="refreshBtn" title="重新整理" aria-label="重新整理">↻</button>
        <button class="icon-btn" id="settingsBtn" title="設定" aria-label="設定">⚙</button>
      </div>
    </div>
    <div class="tabs" id="dayTabs"></div>
    <div class="status-line" id="statusLine"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<dialog id="settingsDlg">
  <form class="dlg" method="dialog" id="settingsForm">
    <h2>設定</h2>
    <div class="note">所有設定只存在這支手機的瀏覽器裡，不會上傳到其他地方。</div>

    <label class="f" for="apiKey">AirLabs API Key</label>
    <input type="password" id="apiKey" autocomplete="off" placeholder="貼上 airlabs.co 的 API Key">

    <label class="f">長途／隔天回程航點（勾選的航點只配對「過夜後」的回程班機）</label>
    <div class="chips" id="longHaulChips"></div>

    <label class="f" for="layoverH">過夜航點：抵達後至少隔幾小時才算回程班（預設 10）</label>
    <input type="number" id="layoverH" min="1" max="72" step="1">

    <label class="f" for="turnMin">一般航點：抵達後最短折返時間（分鐘，預設 40）</label>
    <input type="number" id="turnMin" min="10" max="600" step="5">

    <label class="f"><input type="checkbox" id="autoRefresh"> App 開著時每 15 分鐘自動更新即時狀態（會消耗 API 次數）</label>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" value="save" id="saveBtn">儲存</button>
      <button class="btn ghost" value="clear" id="clearCacheBtn" type="button">清除班表快取並重抓</button>
      <button class="btn ghost" value="cancel">取消</button>
    </div>
    <p class="note" style="margin-top:14px">
      班表（航線、班號、表定時間）每 7 天向 API 抓一次；即時狀態（延誤、登機門）每次重新整理抓 2 次。<br>
      「回程」是依航空公司公開班表自動配對的，<b>不一定是女友實際的組員排班</b>。
    </p>
  </form>
</dialog>

<script>
(() => {
'use strict';

/* ---------- 基本資料 ---------- */
const API = 'https://airlabs.co/api/v9/';
const HOME = 'TPE';
const TPE_TZ = 'Asia/Taipei';
const ROUTE_TTL = 7 * 24 * 3600e3;
const LIVE_TTL = 10 * 60e3;

// 航點中文名稱與時區（僅作顯示與時間換算；未列出的航點會顯示 IATA 代碼並改用 API 的 UTC 時間）
const AIRPORTS = {
  TPE:['台北桃園','Asia/Taipei'], RMQ:['台中','Asia/Taipei'], KHH:['高雄','Asia/Taipei'],
  LAX:['洛杉磯','America/Los_Angeles'], SFO:['舊金山','America/Los_Angeles'], SEA:['西雅圖','America/Los_Angeles'],
  ONT:['安大略','America/Los_Angeles'], PHX:['鳳凰城','America/Phoenix'],
  PRG:['布拉格','Europe/Prague'],
  SIN:['新加坡','Asia/Singapore'], KUL:['吉隆坡','Asia/Kuala_Lumpur'], PEN:['檳城','Asia/Kuala_Lumpur'],
  BKK:['曼谷','Asia/Bangkok'], CNX:['清邁','Asia/Bangkok'],
  NRT:['東京成田','Asia/Tokyo'], HND:['東京羽田','Asia/Tokyo'], CTS:['札幌','Asia/Tokyo'],
  KIX:['大阪','Asia/Tokyo'], NGO:['名古屋','Asia/Tokyo'], FUK:['福岡','Asia/Tokyo'], OKA:['沖繩','Asia/Tokyo'],
  SDJ:['仙台','Asia/Tokyo'], KMJ:['熊本','Asia/Tokyo'], HKD:['函館','Asia/Tokyo'], KOJ:['鹿兒島','Asia/Tokyo'],
  HKG:['香港','Asia/Hong_Kong'], MFM:['澳門','Asia/Macau'],
  MNL:['馬尼拉','Asia/Manila'], CEB:['宿霧','Asia/Manila'], CRK:['克拉克','Asia/Manila'],
  SGN:['胡志明市','Asia/Ho_Chi_Minh'], HAN:['河內','Asia/Ho_Chi_Minh'], DAD:['峴港','Asia/Ho_Chi_Minh'],
  CGK:['雅加達','Asia/Jakarta'], DPS:['峇里島','Asia/Makassar'], ICN:['首爾','Asia/Seoul'], PUS:['釜山','Asia/Seoul'],
};
const REGION = code => {
  if (['LAX','SFO','SEA','ONT','PHX'].includes(code)) return '美洲';
  if (['PRG'].includes(code)) return '歐洲';
  if (['NRT','HND','CTS','KIX','NGO','FUK','OKA','SDJ','KMJ','HKD','KOJ'].includes(code)) return '日本';
  if (['ICN','PUS'].includes(code)) return '韓國';
  if (['HKG','MFM'].includes(code)) return '港澳';
  return '東南亞及其他';
};
const REGION_ORDER = ['美洲','歐洲','日本','韓國','港澳','東南亞及其他'];
// 使用者指定：美洲、歐洲、新加坡、吉隆坡、曼谷、東京、札幌 → 顯示隔天回程
const DEFAULT_LONG = ['LAX','SFO','SEA','ONT','PHX','PRG','SIN','KUL','BKK','NRT','HND','CTS'];
const WEEK = ['sun','mon','tue','wed','thu','fri','sat'];
const WEEK_ZH = ['日','一','二','三','四','五','六'];

/* ---------- 儲存 ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('jx.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('jx.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('jx.'+k); }catch(e){} },
};
const settings = Object.assign({
  apiKey:'', longHaul: DEFAULT_LONG.slice(), layoverH:10, turnMin:40, autoRefresh:false, pinned:[]
}, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);

let dayOffset = 0;          // 0=今天 1=明天 ...
let routes = null;          // {out:[], back:[], fetchedAt}
let live = null;            // {map:{key:obj}, fetchedAt}
let query = '';
let lastError = '';

/* ---------- 時間工具 ---------- */
const pad = n => String(n).padStart(2,'0');
function partsIn(tz, ms){
  const f = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'});
  const o = {}; for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
  return {y:+o.year, m:+o.month, d:+o.day, h:+o.hour, min:+o.minute, wd: WEEK.indexOf(o.weekday.toLowerCase().slice(0,3))};
}
function offsetMin(tz, ms){ const p = partsIn(tz, ms); return Math.round((Date.UTC(p.y,p.m-1,p.d,p.h,p.min) - Math.floor(ms/60000)*60000)/60000); }
// 某時區的「當地日期 + 當地時間」→ 絕對時間 (ms)
function localToMs(tz, y, m, d, hh, mm){
  const guess = Date.UTC(y,m-1,d,hh,mm);
  let ms = guess - offsetMin(tz, guess)*60000;
  ms = guess - offsetMin(tz, ms)*60000; // 夏令時間修正
  return ms;
}
const hm = s => { const t = String(s||'').match(/(\d{1,2}):(\d{2})/); return t ? [+t[1], +t[2]] : null; };
const tzOf = code => AIRPORTS[code] ? AIRPORTS[code][1] : null;
const nameOf = code => AIRPORTS[code] ? AIRPORTS[code][0] : code;

// 沒有時區資料的航點：用 API 給的 dep_time 與 dep_time_utc 推算時差
function fixedOffsetFromRoute(r, which){
  const L = hm(r[which+'_time']), U = hm(r[which+'_time_utc']);
  if (!L || !U) return null;
  let diff = (L[0]*60+L[1]) - (U[0]*60+U[1]);
  while (diff > 14*60) diff -= 1440; while (diff < -12*60) diff += 1440;
  return diff;
}
function routeDepMs(r, y, m, d){
  const t = hm(r.dep_time); if (!t) return null;
  const tz = tzOf(r.dep_iata);
  if (tz) return localToMs(tz, y, m, d, t[0], t[1]);
  const off = fixedOffsetFromRoute(r,'dep'); if (off == null) return null;
  return Date.UTC(y,m-1,d,t[0],t[1]) - off*60000;
}
function routeDurMin(r, depMs){
  if (r.duration) return +r.duration;
  // 沒有 duration 時用到達時間推算
  const a = hm(r.arr_time), tz = tzOf(r.arr_iata); if (!a || !tz) return null;
  const p = partsIn(tz, depMs);
  let arr = localToMs(tz, p.y, p.m, p.d, a[0], a[1]);
  while (arr <= depMs) arr += 86400e3;
  return Math.round((arr - depMs)/60000);
}
function localParts(code, r, which, ms){
  const tz = tzOf(code);
  if (tz) return partsIn(tz, ms);
  const off = fixedOffsetFromRoute(r, which) ?? 0;
  const dt = new Date(ms + off*60000);
  return {y:dt.getUTCFullYear(), m:dt.getUTCMonth()+1, d:dt.getUTCDate(), h:dt.getUTCHours(), min:dt.getUTCMinutes(), wd:dt.getUTCDay()};
}
function operatesOn(r, wd){
  const days = r.days;
  if (!Array.isArray(days) || !days.length) return true; // API 未提供營運日：視為每日（畫面會標示）
  return days.some(x => {
    if (typeof x === 'string'){ const s = x.toLowerCase().slice(0,3); return WEEK.indexOf(s) === wd || s === String(wd===0?7:wd); }
    if (typeof x === 'number') return (x % 7) === wd; // 1=一 … 7=日；0 也視為日
    return false;
  });
}
const fmt = p => pad(p.h)+':'+pad(p.min);
function dayDiffLabel(p, base){ // base = {y,m,d}
  const diff = Math.round((Date.UTC(p.y,p.m-1,p.d) - Date.UTC(base.y,base.m-1,base.d))/86400e3);
  if (diff === 0) return '';
  if (diff === 1) return '隔天';
  if (diff === -1) return '前一天';
  return (diff>0?'+':'')+diff+'天';
}
function countdown(ms){
  const diff = ms - Date.now(), a = Math.abs(diff);
  const h = Math.floor(a/3600e3), m = Math.floor(a%3600e3/60e3);
  const s = (h? h+' 小時 ':'') + m + ' 分';
  return diff >= 0 ? s+'後' : s+'前';
}

/* ---------- API ---------- */
async function api(endpoint, params){
  const u = new URL(API + endpoint);
  for (const [k,v] of Object.entries(params)) u.searchParams.set(k, v);
  u.searchParams.set('api_key', settings.apiKey);
  let res;
  try { res = await fetch(u.toString()); }
  catch(e){ throw new Error('連不上 AirLabs（網路或瀏覽器阻擋）：'+e.message); }
  let j; try { j = await res.json(); } catch(e){ throw new Error('AirLabs 回應不是 JSON（HTTP '+res.status+'）'); }
  if (j && j.error) throw new Error('AirLabs 錯誤：' + (j.error.message || j.error.code || JSON.stringify(j.error)));
  if (!res.ok) throw new Error('AirLabs HTTP ' + res.status);
  return Array.isArray(j.response) ? j.response : [];
}
async function apiAll(endpoint, params){
  const limit = 500, out = [];
  for (let page = 0; page < 6; page++){
    const rows = await api(endpoint, Object.assign({}, params, {limit, offset: page*limit}));
    out.push(...rows);
    if (rows.length < limit) break;
  }
  return out;
}
const isJX = r => String(r.flight_iata || ((r.airline_iata||'')+(r.flight_number||''))).toUpperCase().startsWith('JX');
const fno = r => String(r.flight_iata || ((r.airline_iata||'JX')+(r.flight_number||''))).toUpperCase();

async function loadRoutes(force){
  const cached = store.get('routes', null);
  if (!force && cached && Date.now() - cached.fetchedAt < ROUTE_TTL){ routes = cached; return; }
  const [out, back] = await Promise.all([
    apiAll('routes', {airline_iata:'JX', dep_iata:HOME}),
    apiAll('routes', {airline_iata:'JX', arr_iata:HOME}),
  ]);
  const dedupe = arr => { const seen = new Set(); return arr.filter(isJX).filter(r => { const k = fno(r)+r.dep_iata+r.arr_iata+r.dep_time; if (seen.has(k)) return false; seen.add(k); return true; }); };
  routes = {out: dedupe(out), back: dedupe(back), fetchedAt: Date.now()};
  store.set('routes', routes);
}
async function loadLive(force){
  const cached = store.get('live', null);
  if (!force && cached && Date.now() - cached.fetchedAt < LIVE_TTL){ live = cached; return; }
  const [d, a] = await Promise.all([
    api('schedules', {dep_iata:HOME, airline_iata:'JX'}),
    api('schedules', {arr_iata:HOME, airline_iata:'JX'}),
  ]);
  const map = {};
  for (const s of [...d, ...a]){
    const date = String(s.dep_time || '').slice(0,10);
    if (!date) continue;
    map[fno(s)+'|'+date] = s;
  }
  live = {map, fetchedAt: Date.now()};
  store.set('live', live);
}

/* ---------- 配對邏輯 ---------- */
function buildBoard(){
  if (!routes) return [];
  const now = Date.now();
  const tp = partsIn(TPE_TZ, now);
  const baseMs = Date.UTC(tp.y, tp.m-1, tp.d) + dayOffset*86400e3;
  const bd = new Date(baseMs);
  const base = {y:bd.getUTCFullYear(), m:bd.getUTCMonth()+1, d:bd.getUTCDate(), wd:bd.getUTCDay()};

  const rows = [];
  for (const r of routes.out){
    if (r.dep_iata !== HOME || !operatesOn(r, base.wd)) continue;
    const depMs = routeDepMs(r, base.y, base.m, base.d); if (depMs == null) continue;
    const dur = routeDurMin(r, depMs);
    const arrMs = dur != null ? depMs + dur*60000 : null;
    const dest = r.arr_iata;
    const isLong = settings.longHaul.includes(dest);
    let ret = null;
    if (arrMs != null){
      const minGap = isLong ? settings.layoverH*3600e3 : settings.turnMin*60000;
      const ap = localParts(dest, r, 'arr', arrMs);
      const cands = routes.back.filter(b => b.dep_iata === dest && b.arr_iata === HOME);
      for (let k = 0; k <= 4 && !ret; k++){
        const dd = new Date(Date.UTC(ap.y, ap.m-1, ap.d) + k*86400e3);
        const ly = dd.getUTCFullYear(), lm = dd.getUTCMonth()+1, ld = dd.getUTCDate(), lwd = dd.getUTCDay();
        let best = null;
        for (const b of cands){
          if (!operatesOn(b, lwd)) continue;
          const bdep = routeDepMs(b, ly, lm, ld); if (bdep == null || bdep < arrMs + minGap) continue;
          if (!best || bdep < best.depMs) best = {r:b, depMs:bdep};
        }
        if (best){
          const bd2 = routeDurMin(best.r, best.depMs);
          ret = {r:best.r, depMs:best.depMs, arrMs: bd2 != null ? best.depMs + bd2*60000 : null};
        }
      }
    }
    rows.push({r, dest, isLong, depMs, arrMs, ret, base});
  }
  rows.sort((a,b) => a.depMs - b.depMs);
  return rows;
}

function liveFor(r, depMs){
  if (!live) return null;
  const p = localParts(r.dep_iata, r, 'dep', depMs);
  return live.map[fno(r)+'|'+p.y+'-'+pad(p.m)+'-'+pad(p.d)] || null;
}
function badge(s){
  if (!s) return '<span class="badge b-none">表定</span>';
  const st = String(s.status||'').toLowerCase();
  const delay = +(s.dep_delayed || s.delayed || 0);
  if (st === 'cancelled') return '<span class="badge b-bad">取消</span>';
  if (st === 'landed') return '<span class="badge b-ok">已抵達</span>';
  if (st === 'active' || st === 'en-route') return '<span class="badge b-info">飛行中</span>';
  if (delay >= 15) return '<span class="badge b-warn">延誤 '+delay+' 分</span>';
  return '<span class="badge b-ok">準時</span>';
}
function liveDetail(s, kind){
  if (!s) return '';
  const bits = [];
  const est = kind === 'dep' ? (s.dep_actual || s.dep_estimated) : (s.arr_actual || s.arr_estimated);
  if (est) bits.push((kind==='dep' ? (s.dep_actual?'實際起飛 ':'預估起飛 ') : (s.arr_actual?'實際抵達 ':'預估抵達 ')) + String(est).slice(11,16));
  if (kind === 'dep' && s.dep_gate) bits.push('登機門 '+s.dep_gate);
  if (kind === 'arr' && s.arr_baggage) bits.push('行李轉盤 '+s.arr_baggage);
  return bits.length ? '<div class="sub">即時：'+esc(bits.join('・'))+'</div>' : '';
}
// 數字航廈顯示 T1、T2；字母或其他名稱（如 B、INTL）照原樣顯示
const termLabel = t => /^\d+$/.test(String(t).replace(/^T/i,'')) ? 'T'+String(t).replace(/^T/i,'') : String(t);
// 航廈：即時資料優先 → 班表欄位 → 未提供（不自行猜測）
function terminalOf(r, s, which){
  const liveT = s && s[which+'_terminal'];
  if (liveT) return {t:String(liveT), src:'即時'};
  const arr = r[which+'_terminals'];
  const fixed = Array.isArray(arr) ? arr.filter(Boolean).join('/') : (arr || r[which+'_terminal']);
  if (fixed) return {t:String(fixed), src:'表定'};
  return null;
}
function terminalHtml(r, s){
  const d = terminalOf(r, s, 'dep'), a = terminalOf(r, s, 'arr');
  const show = (x, lbl) => `<span class="ti">${x ? `${lbl} <b>${esc(termLabel(x.t))}</b><span class="tsrc">${x.src}</span>` : `${lbl} <span class="tna">未提供</span>`}</span>`;
  return `<div class="term">${show(d,'起飛航廈')}${show(a,'落地航廈')}</div>`;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 畫面 ---------- */
const $ = id => document.getElementById(id);
function renderTabs(){
  const tp = partsIn(TPE_TZ, Date.now());
  let html = '';
  for (let i = 0; i < 7; i++){
    const d = new Date(Date.UTC(tp.y,tp.m-1,tp.d) + i*86400e3);
    const lbl = i===0 ? '今天' : i===1 ? '明天' : (d.getUTCMonth()+1)+'/'+d.getUTCDate();
    html += `<button class="${i===dayOffset?'on':''}" data-d="${i}">${lbl}（${WEEK_ZH[d.getUTCDay()]}）</button>`;
  }
  $('dayTabs').innerHTML = html;
  const d0 = new Date(Date.UTC(tp.y,tp.m-1,tp.d) + dayOffset*86400e3);
  $('dateLabel').textContent = `台北出發 ${d0.getUTCFullYear()}/${d0.getUTCMonth()+1}/${d0.getUTCDate()}（${WEEK_ZH[d0.getUTCDay()]}）・時間皆為當地時間`;
}

function legHtml(kind, r, depMs, arrMs, base){
  const from = r.dep_iata, to = r.arr_iata;
  const dp = localParts(from, r, 'dep', depMs);
  const ap = arrMs != null ? localParts(to, r, 'arr', arrMs) : null;
  const dlab = dayDiffLabel(dp, base), alab = ap ? dayDiffLabel(ap, base) : '';
  const s = liveFor(r, depMs);
  const daysNote = (!Array.isArray(r.days) || !r.days.length) ? '・API 未提供營運日' : '';
  return `<div class="leg">
    <div><div class="dir">${kind==='out'?'去程':'回程'}</div><div class="fno">${esc(fno(r))}</div></div>
    <div>
      <div class="times">${esc(from)} ${fmt(dp)}${dlab?`<span class="d">${dlab}</span>`:''}<span class="arrow">→</span>${esc(to)} ${ap?fmt(ap):'--:--'}${alab?`<span class="d">${alab}</span>`:''}</div>
      <div class="sub">${esc(nameOf(from))} → ${esc(nameOf(to))}${r.aircraft_icao?'・'+esc(r.aircraft_icao):''}${daysNote}</div>
      ${terminalHtml(r, s)}
      ${liveDetail(s, kind==='out'?'dep':'arr')}
    </div>
    <div>${badge(s)}</div>
  </div>`;
}

function render(){
  renderTabs();
  const main = $('main');
  if (!settings.apiKey){
    main.innerHTML = `<div class="setup">
      <h2>第一次使用：設定 API Key</h2>
      <ol>
        <li>到 <b>airlabs.co</b> 註冊帳號（有免費方案，額度以官網為準）。</li>
        <li>在後台複製你的 API Key。</li>
        <li>點右上角 ⚙ 貼上，按「儲存」。</li>
      </ol>
      <div class="note">班表資料全部來自 AirLabs API，本 App 不內建任何班號或時間，避免顯示過期或錯誤資訊。</div>
      <button class="btn" id="openSettings2">開啟設定</button>
    </div>`;
    $('openSettings2').onclick = openSettings;
    $('statusLine').textContent = '';
    return;
  }
  if (!routes){
    main.innerHTML = lastError ? `<div class="err">${esc(lastError)}</div>` : '<div class="empty">讀取班表中…</div>';
    return;
  }
  const board = buildBoard();
  const pinned = new Set(settings.pinned);
  const q = query.trim().toLowerCase();
  const list = board.filter(x => !q || [x.dest, nameOf(x.dest), fno(x.r), x.ret && fno(x.ret.r)].filter(Boolean).some(s => String(s).toLowerCase().includes(q)));

  // 通知摘要
  const now = Date.now();
  const nextDep = board.filter(x => x.depMs > now).sort((a,b)=>a.depMs-b.depMs)[0];
  const nextArr = board.filter(x => x.ret && x.ret.arrMs && x.ret.arrMs > now).sort((a,b)=>a.ret.arrMs-b.ret.arrMs)[0];
  const pinnedRows = board.filter(x => pinned.has(x.dest));
  let notice = '<div class="notice"><h2>通知</h2>';
  const nrow = (lbl, big, ms) => `<div class="nrow"><div><div class="lbl">${lbl}</div><div class="big">${big}</div></div><div class="cd">${ms?countdown(ms):''}</div></div>`;
  if (nextDep){ const p = partsIn(TPE_TZ, nextDep.depMs); notice += nrow('下一班從台北出發', `${esc(fno(nextDep.r))} ${fmt(p)} → ${esc(nameOf(nextDep.dest))}`, nextDep.depMs); }
  const arrTermTxt = x => { const t = terminalOf(x.ret.r, liveFor(x.ret.r, x.ret.depMs), 'arr'); return t ? `・落地航廈 ${esc(termLabel(t.t))}` : '・落地航廈未提供'; };
  if (nextArr){ const p = partsIn(TPE_TZ, nextArr.ret.arrMs); notice += nrow('下一班回到台北（台北時間）', `${esc(fno(nextArr.ret.r))} ${fmt(p)} ${dayDiffLabel(p, nextArr.base)} ← ${esc(nameOf(nextArr.dest))}<div class="lbl">${arrTermTxt(nextArr)}</div>`, nextArr.ret.arrMs); }
  for (const x of pinnedRows){
    const p = partsIn(TPE_TZ, x.depMs);
    const rp = x.ret && x.ret.arrMs ? partsIn(TPE_TZ, x.ret.arrMs) : null;
    notice += nrow(`★ ${esc(nameOf(x.dest))}`, `${esc(fno(x.r))} ${fmt(p)} 出發・${x.ret?esc(fno(x.ret.r))+' '+(rp?fmt(rp)+' '+dayDiffLabel(rp, x.base):'')+' 回台'+arrTermTxt(x):'無回程資料'}`, null);
  }
  if (!nextDep && !nextArr && !pinnedRows.length) notice += '<div class="note">這一天沒有尚未出發的航班。</div>';
  notice += '</div>';

  let html = notice + `<input class="search" id="search" type="search" placeholder="搜尋航點、班號（例：東京、JX800）" value="${esc(query)}">`;
  if (lastError) html += `<div class="err">${esc(lastError)}</div>`;
  if (!list.length){
    html += `<div class="empty">${board.length ? '找不到符合的航班' : '這一天 API 沒有回傳從台北出發的星宇航班。<br>若持續如此，請到設定「清除班表快取並重抓」。'}</div>`;
  } else {
    const groups = {};
    for (const x of list){ const g = pinned.has(x.dest) ? '★ 釘選' : REGION(x.dest); (groups[g] = groups[g] || []).push(x); }
    for (const g of ['★ 釘選', ...REGION_ORDER]){
      if (!groups[g]) continue;
      html += `<div class="group-title">${g}</div>`;
      for (const x of groups[g]){
        html += `<div class="card ${pinned.has(x.dest)?'pinned':''}">
          <div class="chead">
            <div class="dest">${esc(nameOf(x.dest))}<span class="code">${esc(x.dest)}</span></div>
            <div style="display:flex;gap:6px;align-items:center">
              ${x.isLong ? '<span class="tag">過夜・隔天回程</span>' : '<span class="tag">當天來回</span>'}
              <button class="pin ${pinned.has(x.dest)?'on':''}" data-pin="${esc(x.dest)}" aria-label="釘選">${pinned.has(x.dest)?'★':'☆'}</button>
            </div>
          </div>
          ${legHtml('out', x.r, x.depMs, x.arrMs, x.base)}
          ${x.ret ? legHtml('back', x.ret.r, x.ret.depMs, x.ret.arrMs, x.base) : '<div class="sub" style="padding-top:8px">找不到符合條件的回程班機（可在設定調整過夜時數）</div>'}
        </div>`;
      }
    }
  }
  html += `<p class="note" style="margin-top:16px">資料來源：AirLabs API。班表更新於 ${new Date(routes.fetchedAt).toLocaleString('zh-TW',{timeZone:TPE_TZ})}${live?'；即時狀態更新於 '+new Date(live.fetchedAt).toLocaleTimeString('zh-TW',{timeZone:TPE_TZ,hour:'2-digit',minute:'2-digit'}):''}。即時狀態只涵蓋接近起降時間的航班，其他顯示「表定」。正式資訊請以星宇航空官網／App 為準。</p>`;
  main.innerHTML = html;
  const s = $('search');
  s.oninput = e => { query = e.target.value; const pos = e.target.selectionStart; render(); const n = $('search'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} };
}

/* ---------- 事件 ---------- */
async function refresh(forceLive, forceRoutes){
  if (!settings.apiKey){ render(); return; }
  lastError = '';
  $('statusLine').textContent = '更新中…';
  try { await loadRoutes(forceRoutes); }
  catch(e){ lastError = '班表讀取失敗：' + e.message; routes = routes || store.get('routes', null); }
  try { await loadLive(forceLive); }
  catch(e){ lastError = (lastError ? lastError + '\n' : '') + '即時狀態讀取失敗：' + e.message; live = live || store.get('live', null); }
  $('statusLine').textContent = lastError ? '部分資料讀取失敗' : '已更新 ' + new Date().toLocaleTimeString('zh-TW',{timeZone:TPE_TZ,hour:'2-digit',minute:'2-digit'});
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-d],[data-pin]');
  if (!t) return;
  if (t.dataset.d != null){ dayOffset = +t.dataset.d; render(); }
  if (t.dataset.pin){
    const c = t.dataset.pin, i = settings.pinned.indexOf(c);
    if (i >= 0) settings.pinned.splice(i,1); else settings.pinned.push(c);
    saveSettings(); render();
  }
});
$('refreshBtn').onclick = () => refresh(true, false);

function openSettings(){
  $('apiKey').value = settings.apiKey;
  $('layoverH').value = settings.layoverH;
  $('turnMin').value = settings.turnMin;
  $('autoRefresh').checked = !!settings.autoRefresh;
  const codes = new Set([...DEFAULT_LONG, ...settings.longHaul, ...(routes ? routes.out.map(r => r.arr_iata) : [])]);
  $('longHaulChips').innerHTML = [...codes].filter(Boolean).sort((a,b)=>REGION_ORDER.indexOf(REGION(a))-REGION_ORDER.indexOf(REGION(b)) || a.localeCompare(b))
    .map(c => `<label><input type="checkbox" value="${esc(c)}" ${settings.longHaul.includes(c)?'checked':''}>${esc(nameOf(c))}</label>`).join('');
  $('settingsDlg').showModal();
}
$('settingsBtn').onclick = openSettings;
$('settingsForm').addEventListener('submit', e => {
  if (e.submitter && e.submitter.value === 'save'){
    const keyChanged = $('apiKey').value.trim() !== settings.apiKey;
    settings.apiKey = $('apiKey').value.trim();
    settings.layoverH = Math.max(1, +$('layoverH').value || 10);
    settings.turnMin = Math.max(10, +$('turnMin').value || 40);
    settings.autoRefresh = $('autoRefresh').checked;
    settings.longHaul = [...$('longHaulChips').querySelectorAll('input:checked')].map(i => i.value);
    saveSettings();
    setupAuto();
    if (keyChanged){ routes = null; live = null; store.del('routes'); store.del('live'); refresh(true, true); }
    else render();
  }
});
$('clearCacheBtn').onclick = () => { store.del('routes'); store.del('live'); routes = null; live = null; $('settingsDlg').close(); refresh(true, true); };

let timer = null;
function setupAuto(){
  clearInterval(timer);
  if (settings.autoRefresh) timer = setInterval(() => { if (document.visibilityState === 'visible') refresh(true, false); }, 15*60e3);
}
// 每分鐘重繪倒數（不呼叫 API）
setInterval(() => { if (routes && document.visibilityState === 'visible' && !$('settingsDlg').open && document.activeElement?.id !== 'search') render(); }, 60e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false, false); });

routes = store.get('routes', null);
live = store.get('live', null);
setupAuto();
render();
refresh(false, false);
})();
</script>
</body>
</html>
